services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptoscan_user
      POSTGRES_PASSWORD: cryptoscan_password
      POSTGRES_DB: cryptoscan
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoscan_user -d cryptoscan"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend-core:
    build:
      context: .
      dockerfile: backend-core/Dockerfile
    env_file: ./backend-core/.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://cryptoscan_user:cryptoscan_password@postgres:5432/cryptoscan
    volumes:
      - backend-uploads:/app/backend-core/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  cbom-service:
    build: ./cbom-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4003/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-core:
        condition: service_healthy
      cbom-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
