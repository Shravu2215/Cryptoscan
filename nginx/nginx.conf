# Single ingress point for the self-hosted VM deployment.
#
# - backend-core also serves the static frontend (same origin as the API,
#   so no CORS is needed between the browser and the app).
# - cbom-service is proxied under /cbom-api/ for services that need it
#   directly; it is not currently linked from the frontend.
# - TLS: terminate HTTPS here (or in front of this, e.g. a cloud load
#   balancer) before going to production — this default config is HTTP-only
#   and expects a TLS-terminating proxy/cert to be added per-environment.

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://backend-core:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cbom-api/ {
        proxy_pass http://cbom-service:4003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
